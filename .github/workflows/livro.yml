# Renderiza o livro em cada PR e publica no GitHub Pages a cada push na main.
# É o exemplo vivo do capítulo 8 (CI/CD e ambientes).
name: Livro

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Renderizar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar o livro
        run: quarto render

      - name: Guardar o site para publicação
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  links:
    name: Checar links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          # Links do próprio repositório ficam de fora: alguns só existem depois do primeiro push.
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude '^https://github\.com/Garon-Sys/manual-saas'
            --exclude '^https://garon-sys\.github\.io/manual-saas'
            './**/*.qmd' './**/*.md'
          fail: true

  publicar:
    name: Publicar no GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
